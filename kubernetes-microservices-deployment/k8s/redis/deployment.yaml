# Single-instance cache — deliberately not autoscaled. Redis here is
# in-memory, unclustered state; scaling it horizontally would mean multiple
# instances with inconsistent data, which is worse than not scaling at all.
# A real deployment would replace this with ElastiCache, not more replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: microservices-demo
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
