# type: LoadBalancer on EKS is provisioned by the in-tree AWS cloud
# provider (no extra controller to install) — the annotation below asks it
# for a Network Load Balancer instead of the default Classic ELB.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: microservices-demo
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
